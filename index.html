<!DOCTYPE html>
<html lang="ja" data-theme="aurora">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>取扱店舗ガイド | ARTISTIC FINDER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style>
    /* 🎨 3つのテーマ定義 */
    [data-theme="aurora"] {
      --bg-color: #0b0f19;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-hover-border: rgba(99, 102, 241, 0.5);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --accent-glow: rgba(168, 85, 247, 0.35);
      --blob1: #4f46e5; --blob2: #c026d3; --blob3: #06b6d4;
    }

    [data-theme="cyberpunk"] {
      --bg-color: #05050a;
      --card-bg: rgba(15, 23, 42, 0.7);
      --card-border: rgba(236, 72, 153, 0.3);
      --card-hover-border: #facc15;
      --text-main: #ffffff;
      --text-muted: #f472b6;
      --accent-grad: linear-gradient(135deg, #ff0055 0%, #facc15 100%);
      --accent-glow: rgba(255, 0, 85, 0.5);
      --blob1: #ff0055; --blob2: #7928ca; --blob3: #facc15;
    }

    [data-theme="emerald"] {
      --bg-color: #061412;
      --card-bg: rgba(20, 83, 45, 0.2);
      --card-border: rgba(52, 211, 153, 0.2);
      --card-hover-border: #34d399;
      --text-main: #ecfdf5;
      --text-muted: #6ee7b7;
      --accent-grad: linear-gradient(135deg, #059669 0%, #10b981 50%, #34d399 100%);
      --accent-glow: rgba(16, 185, 129, 0.35);
      --blob1: #047857; --blob2: #0d9488; --blob3: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 20px 80px;
      overflow-x: hidden;
      position: relative;
      transition: background-color 0.5s ease;
    }

    /* 背景アニメーション */
    .bg-blobs { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; filter: blur(90px); pointer-events: none; }
    .blob { position: absolute; border-radius: 50%; opacity: 0.5; animation: floatBlob 25s infinite alternate ease-in-out; transition: background 0.5s ease; }
    .blob-1 { width: 450px; height: 450px; background: var(--blob1); top: -100px; left: -100px; }
    .blob-2 { width: 500px; height: 500px; background: var(--blob2); bottom: -150px; right: -100px; animation-delay: -7s; }
    .blob-3 { width: 350px; height: 350px; background: var(--blob3); top: 40%; left: 50%; transform: translate(-50%, -50%); animation-delay: -14s; }

    @keyframes floatBlob {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, 80px) scale(1.15); }
      100% { transform: translate(-40px, 40px) scale(0.9); }
    }

    .container { max-width: 1000px; margin: 0 auto; position: relative; z-index: 1; }

    /* 🎨 テーマ切り替えコントロール */
    .header-top { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 20px; }
    .theme-btn {
      background: rgba(255, 255, 255, 0.08); border: 1px solid var(--card-border); color: #fff;
      padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; transition: all 0.3s;
    }
    .theme-btn:hover { background: rgba(255, 255, 255, 0.2); }

    header { text-align: center; margin-bottom: 25px; }
    .title-tag {
      display: inline-block; font-size: 0.8rem; letter-spacing: 0.25em; text-transform: uppercase;
      background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; margin-bottom: 8px;
    }
    h1 {
      font-size: 2.5rem; font-weight: 800; line-height: 1.2;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 15px;
    }

    /* ❤️ お気に入りフィルターボタン */
    .action-bar { display: flex; justify-content: center; margin-bottom: 20px; }
    .btn-fav-filter {
      background: rgba(255, 255, 255, 0.08); border: 1px solid var(--card-border); color: #fff;
      font-weight: 600; padding: 12px 24px; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(10px);
    }
    .btn-fav-filter.active { background: #ec4899; border-color: #ec4899; box-shadow: 0 0 20px rgba(236, 72, 153, 0.4); }

    /* 🏷️ エリア・人気タグチップ */
    .quick-tags { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .tag-chip {
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); color: var(--text-muted);
      padding: 6px 14px; border-radius: 15px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
    }
    .tag-chip:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

    /* 検索パネル */
    .search-panel {
      background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--card-border);
      border-radius: 24px; padding: 22px; margin-bottom: 25px; display: flex; flex-wrap: wrap; gap: 15px;
    }
    .input-group { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); font-weight: 600; }
    input, select {
      width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px; padding: 12px 16px; color: #fff; font-size: 0.95rem; outline: none; transition: all 0.3s;
    }
    input:focus, select:focus { border-color: var(--card-hover-border); box-shadow: 0 0 15px var(--accent-glow); }
    select option { background-color: #0f172a; color: #fff; }

    /* ステータスバー */
    .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 10px; }
    .result-count span { color: #fff; font-weight: 800; font-size: 1.2rem; background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* 店舗グリッド & カード */
    .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .store-card {
      background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--card-border);
      border-radius: 20px; padding: 22px; display: flex; flex-direction: column; position: relative;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); animation: fadeInUp 0.4s forwards;
    }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .store-card:hover { transform: translateY(-5px); border-color: var(--card-hover-border); box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4); }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .card-category { font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); }
    
    /* ❤️ お気に入りボタン */
    .fav-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; opacity: 0.3; filter: grayscale(100%); transition: all 0.2s; outline: none; }
    .fav-btn.active { opacity: 1; filter: grayscale(0%); transform: scale(1.15); }
    .fav-btn:hover { transform: scale(1.25); }

    .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; color: #fff; line-height: 1.3; }
    .card-kana { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px; }
    .card-address { font-size: 0.85rem; color: var(--text-main); margin-bottom: 15px; }

    /* アクションボタン (マップ, QR, コピー) */
    .card-actions { display: flex; gap: 6px; margin-top: auto; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 12px; }
    .action-btn {
      flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px; padding: 8px 0; color: #cbd5e1; font-size: 0.75rem; cursor: pointer; text-decoration: none;
      display: flex; align-items: center; justify-content: center; gap: 4px; transition: all 0.2s;
    }
    .action-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

    /* 📱 QRコードモーダル */
    .modal-overlay {
      position: fixed; top:0; left:0; width:100vw; height:100vh; background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; z-index: 100;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content {
      background: #0f172a; border: 1px solid var(--card-hover-border); border-radius: 28px;
      padding: 30px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 0 50px var(--accent-glow);
    }
    .modal-close { background: rgba(255, 255, 255, 0.1); border: none; color: #fff; padding: 10px 24px; border-radius: 20px; cursor: pointer; margin-top: 20px; }

    /* 📋 コピー通知トースト */
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: #10b981; color: #fff; padding: 12px 24px; border-radius: 30px; font-weight: 600;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3); opacity: 0; transition: all 0.3s ease; z-index: 200;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <!-- バックグラウンドオーロラ -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="container">
    <!-- 🎨 3つのテーマ切り替え -->
    <div class="header-top">
      <button class="theme-btn" onclick="setTheme('aurora')">🌌 Aurora</button>
      <button class="theme-btn" onclick="setTheme('cyberpunk')">🌆 Cyberpunk</button>
      <button class="theme-btn" onclick="setTheme('emerald')">🌿 Emerald</button>
    </div>

    <header>
      <span class="title-tag">Store Location Finder</span>
      <h1>取扱店舗ガイド</h1>
    </header>

    <!-- ❤️ お気に入りフィルター -->
    <div class="action-bar">
      <button class="btn-fav-filter" id="fav-filter-btn">❤️ お気に入り店舗のみ表示</button>
    </div>

    <!-- 🏷️ エリア・人気タグチップ -->
    <div class="quick-tags">
      <span class="tag-chip" onclick="applyTag('イオンモール')">📍 イオンモール</span>
      <span class="tag-chip" onclick="applyTag('園町')">📍 園町</span>
      <span class="tag-chip" onclick="applyTag('スーパー')">🛒 スーパー</span>
      <span class="tag-chip" onclick="applyTag('')">🔄 リセット</span>
    </div>

    <!-- 検索パネル -->
    <div class="search-panel">
      <div class="input-group">
        <label for="keyword">Search Keyword</label>
        <input type="text" id="keyword" placeholder="店舗名・フリガナ・住所...">
      </div>
      <div class="input-group">
        <label for="category-select">Category</label>
        <select id="category-select">
          <option value="">すべてのカテゴリー</option>
        </select>
      </div>
    </div>

    <div class="status-bar">
      <div class="result-count" id="result-count">読み込み中...</div>
    </div>

    <div class="store-grid" id="store-grid"></div>
  </div>

  <!-- 📱 QRコード表示モーダル -->
  <div class="modal-overlay" id="qr-modal">
    <div class="modal-content">
      <h3 id="qr-title" style="margin-bottom:15px; font-size:1.1rem; color:#fff;">店舗QRコード</h3>
      <div id="qr-code-container" style="margin: 15px 0;"></div>
      <p style="font-size:0.8rem; color:var(--text-muted);">スマホのカメラでスキャンしてGoogleマップを開けます</p>
      <button class="modal-close" onclick="closeQrModal()">閉じる</button>
    </div>
  </div>

  <!-- 📋 コピー通知トースト -->
  <div class="toast" id="toast">コピーしました！</div>

  <script>
    let storesData = [];
    let favoriteStores = JSON.parse(localStorage.getItem('fav_stores') || '[]');
    let showFavoritesOnly = false;

    // data.json の読み込み
    async function loadStores() {
      try {
        const response = await fetch('data.json');
        if (!response.ok) throw new Error('読み込み失敗');
        storesData = await response.json();
        
        initCategoryFilter(storesData);
        renderStores();
      } catch (error) {
        document.getElementById('result-count').textContent = 'データの読み込みに失敗しました。';
      }
    }

    // カテゴリー枠のソート設定（数字昇順）
    function initCategoryFilter(data) {
      const categorySelect = document.getElementById('category-select');
      const categories = [...new Set(data.map(item => item.category))];

      categories.sort((a, b) => {
        const numA = parseInt(a.match(/^(\d+)/)?.[1] || 0, 10);
        const numB = parseInt(b.match(/^(\d+)/)?.[1] || 0, 10);
        return numA - numB;
      });

      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        categorySelect.appendChild(option);
      });
    }

    // 店舗グリッド描画
    function renderStores() {
      const gridContainer = document.getElementById('store-grid');
      const countContainer = document.getElementById('result-count');
      const keyword = document.getElementById('keyword').value.toLowerCase().trim();
      const selectedCategory = document.getElementById('category-select').value;

      const filtered = storesData.filter(store => {
        const matchesCategory = !selectedCategory || store.category === selectedCategory;
        const matchesKeyword = !keyword || 
          (store.name && store.name.toLowerCase().includes(keyword)) ||
          (store.kana && store.kana.toLowerCase().includes(keyword)) ||
          (store.address && store.address.toLowerCase().includes(keyword));
        const matchesFav = !showFavoritesOnly || favoriteStores.includes(store.name);

        return matchesCategory && matchesKeyword && matchesFav;
      });

      gridContainer.innerHTML = '';
      countContainer.innerHTML = `検索結果: <span>${filtered.length}</span> 件`;

      if (filtered.length === 0) {
        gridContainer.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 50px; color:var(--text-muted);">該当する店舗が見つかりませんでした。</div>';
        return;
      }

      filtered.forEach((store, index) => {
        const isFav = favoriteStores.includes(store.name);
        const card = document.createElement('div');
        card.className = 'store-card';
        card.style.animationDelay = `${Math.min(index * 0.04, 0.3)}s`;

        // 📍 1. Googleマップ連携用URL
        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(store.name + ' ' + store.address)}`;

        card.innerHTML = `
          <div class="card-top">
            <span class="card-category">${escapeHtml(store.category)}</span>
            <!-- ❤️ お気に入りボタン -->
            <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${escapeHtml(store.name)}')">❤️</button>
          </div>
          <h2 class="card-title">${escapeHtml(store.name)}</h2>
          <div class="card-kana">${escapeHtml(store.kana || '')}</div>
          <div class="card-address">📍 ${escapeHtml(store.address)}</div>
          
          <div class="card-actions">
            <!-- 📍 Googleマップボタン -->
            <a href="${mapUrl}" target="_blank" class="action-btn">🗺️ Map</a>
            <!-- 📱 QRコードボタン -->
            <button class="action-btn" onclick="openQrModal('${escapeHtml(store.name)}', '${mapUrl}')">📱 QR</button>
            <!-- 📋 1タップコピーボタン -->
            <button class="action-btn" onclick="copyStoreInfo('${escapeHtml(store.name)}', '${escapeHtml(store.address)}')">📋 コピー</button>
          </div>
        `;
        gridContainer.appendChild(card);
      });
    }

    // ❤️ お気に入り（LocalStorage）保存機能
    function toggleFavorite(storeName) {
      if (favoriteStores.includes(storeName)) {
        favoriteStores = favoriteStores.filter(name => name !== storeName);
      } else {
        favoriteStores.push(storeName);
      }
      localStorage.setItem('fav_stores', JSON.stringify(favoriteStores));
      renderStores();
    }

    document.getElementById('fav-filter-btn').addEventListener('click', function() {
      showFavoritesOnly = !showFavoritesOnly;
      this.classList.toggle('active', showFavoritesOnly);
      renderStores();
    });

    // 🎨 3つのテーマ切替
    function setTheme(themeName) {
      document.documentElement.setAttribute('data-theme', themeName);
      showToast(`テーマを [${themeName.toUpperCase()}] に変更しました`);
    }

    // 🏷️ クイックタグ適用
    function applyTag(tag) {
      document.getElementById('keyword').value = tag;
      renderStores();
    }

    // 📋 店名・住所1タップコピー
    function copyStoreInfo(name, address) {
      const text = `${name}\n住所: ${address}`;
      navigator.clipboard.writeText(text).then(() => {
        showToast('店名と住所をコピーしました！');
      });
    }

    // 📱 QRコードモーダル表示
    function openQrModal(name, url) {
      document.getElementById('qr-title').textContent = name;
      const qrContainer = document.getElementById('qr-code-container');
      const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
      qrContainer.innerHTML = `<img src="${qrApiUrl}" alt="QR Code" style="border-radius:12px; border: 4px solid #fff;">`;
      document.getElementById('qr-modal').classList.add('active');
    }

    function closeQrModal() {
      document.getElementById('qr-modal').classList.remove('active');
    }

    // トースト通知表示
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // HTMLエスケープ処理
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // イベントリスナー
    document.getElementById('keyword').addEventListener('input', renderStores);
    document.getElementById('category-select').addEventListener('change', renderStores);

    loadStores();
  </script>
</body>
</html>
