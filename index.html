<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>取扱店舗ガイド | ARTISTIC FINDER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-hover-border: rgba(99, 102, 241, 0.5);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --accent-glow: rgba(168, 85, 247, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* --- 動的なオーロラ背景アニメーション --- */
    .bg-blobs {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
      filter: blur(90px);
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      opacity: 0.5;
      animation: floatBlob 25s infinite alternate ease-in-out;
    }

    .blob-1 {
      width: 450px;
      height: 450px;
      background: #4f46e5;
      top: -100px;
      left: -100px;
    }

    .blob-2 {
      width: 500px;
      height: 500px;
      background: #c026d3;
      bottom: -150px;
      right: -100px;
      animation-delay: -7s;
    }

    .blob-3 {
      width: 350px;
      height: 350px;
      background: #06b6d4;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -14s;
    }

    @keyframes floatBlob {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, 80px) scale(1.15); }
      100% { transform: translate(-40px, 40px) scale(0.9); }
    }

    /* --- メインコンテナ --- */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* --- ヘッダー --- */
    header {
      text-align: center;
      margin-bottom: 50px;
    }

    .title-tag {
      display: inline-block;
      font-size: 0.8rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 15px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 300;
    }

    /* --- グラスモフィズム検索パネル --- */
    .search-panel {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px;
      margin-bottom: 35px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      transition: border-color 0.3s ease;
    }

    .search-panel:focus-within {
      border-color: rgba(168, 85, 247, 0.4);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 30px var(--accent-glow);
    }

    .input-group {
      flex: 1;
      min-width: 240px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      font-weight: 600;
    }

    input, select {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 18px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    input::placeholder {
      color: #6b7280;
    }

    input:focus, select:focus {
      border-color: #a855f7;
      background: rgba(15, 23, 42, 0.85);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
    }

    select option {
      background-color: #0f172a;
      color: #fff;
    }

    /* --- 検索結果件数 --- */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding: 0 10px;
    }

    .result-count {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .result-count span {
      color: #fff;
      font-weight: 800;
      font-size: 1.2rem;
      margin: 0 4px;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* --- 店舗グリッド --- */
    .store-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    /* --- 店舗カード --- */
    .store-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .store-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: var(--card-hover-border);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 0 25px rgba(99, 102, 241, 0.2);
    }

    .card-category {
      align-self: flex-start;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .card-kana {
      font-size: 0.75rem;
      color: #6b7280;
      margin-bottom: 18px;
      letter-spacing: 0.03em;
    }

    .card-address {
      font-size: 0.85rem;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 14px;
      margin-top: auto;
    }

    .address-icon {
      color: #ec4899;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 1rem;
    }

    @media (max-width: 640px) {
      h1 { font-size: 2.1rem; }
      .search-panel { padding: 20px; }
    }
  </style>
</head>
<body>

  <!-- 背景オーロラアニメーション -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="container">
    <header>
      <span class="title-tag">Directory & Directory</span>
      <h1>取扱店舗検索</h1>
      <p class="subtitle">目的のカテゴリやキーワードから最適な店舗を素早く検索できます</p>
    </header>

    <!-- 検索フィルター -->
    <div class="search-panel">
      <div class="input-group">
        <label for="keyword">Search Keyword</label>
        <input type="text" id="keyword" placeholder="店舗名・フリガナ・住所を入力...">
      </div>
      <div class="input-group">
        <label for="category-select">Category Filter</label>
        <select id="category-select">
          <option value="">すべてのカテゴリー</option>
        </select>
      </div>
    </div>

    <!-- ステータスバー -->
    <div class="status-bar">
      <div class="result-count" id="result-count">読み込み中...</div>
    </div>

    <!-- 店舗カードリスト -->
    <div class="store-grid" id="store-grid"></div>
  </div>

  <script>
    let storesData = [];

    // JSONデータの読み込み
    async function loadStores() {
      try {
        const response = await fetch('data.json');
        if (!response.ok) {
          throw new Error('JSONファイルの読み込みに失敗しました');
        }
        storesData = await response.json();
        
        initCategoryFilter(storesData);
        renderStores(storesData);
      } catch (error) {
        document.getElementById('result-count').textContent = 'データの読み込みに失敗しました。';
        console.error(error);
      }
    }

    // カテゴリのソート機能（「1.」「8.」「30.」の数字順に正しく昇順ソート）
    function initCategoryFilter(data) {
      const categorySelect = document.getElementById('category-select');
      const categories = [...new Set(data.map(item => item.category))];

      // カテゴリ先頭の数字部分を取り出して数値として比較ソート
      categories.sort((a, b) => {
        const numA = parseInt(a.match(/^(\d+)/)?.[1] || 0, 10);
        const numB = parseInt(b.match(/^(\d+)/)?.[1] || 0, 10);
        return numA - numB;
      });

      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        categorySelect.appendChild(option);
      });
    }

    // 店舗カードのレンダリング
    function renderStores(data) {
      const gridContainer = document.getElementById('store-grid');
      const countContainer = document.getElementById('result-count');
      
      gridContainer.innerHTML = '';
      countContainer.innerHTML = `検索結果: <span>${data.length}</span> 件`;

      if (data.length === 0) {
        gridContainer.innerHTML = '<div class="no-results">該当する店舗が見つかりませんでした。</div>';
        return;
      }

      data.forEach((store, index) => {
        const card = document.createElement('div');
        card.className = 'store-card';
        // 各カードにディレイ（時間差）をつけて流れるように表示
        card.style.animationDelay = `${Math.min(index * 0.05, 0.4)}s`;

        card.innerHTML = `
          <div>
            <span class="card-category">${escapeHtml(store.category)}</span>
            <h2 class="card-title">${escapeHtml(store.name)}</h2>
            <div class="card-kana">${escapeHtml(store.kana || '')}</div>
          </div>
          <div class="card-address">
            <span class="address-icon">📍</span>
            <span>${escapeHtml(store.address)}</span>
          </div>
        `;
        gridContainer.appendChild(card);
      });
    }

    // フィルタリング機能
    function filterStores() {
      const keyword = document.getElementById('keyword').value.toLowerCase().trim();
      const selectedCategory = document.getElementById('category-select').value;

      const filtered = storesData.filter(store => {
        const matchesCategory = !selectedCategory || store.category === selectedCategory;

        const matchesKeyword = !keyword || 
          (store.name && store.name.toLowerCase().includes(keyword)) ||
          (store.kana && store.kana.toLowerCase().includes(keyword)) ||
          (store.address && store.address.toLowerCase().includes(keyword));

        return matchesCategory && matchesKeyword;
      });

      renderStores(filtered);
    }

    // XSS対策エスケープ処理
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // イベントリスナー
    document.getElementById('keyword').addEventListener('input', filterStores);
    document.getElementById('category-select').addEventListener('change', filterStores);

    // 初期実行
    loadStores();
  </script>
</body>
</html>
