<!DOCTYPE html>
<html lang="ja" data-base-theme="dark" data-color-theme="aurora" data-colorful="false">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>取扱店舗ガイド | ARTISTIC FINDER ULTRA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style>
    /* 1. 基本テーマ (ダーク / ライト) */
    [data-base-theme="dark"] {
      --bg-color: #0b0f19;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --input-bg: rgba(0, 0, 0, 0.4);
      --modal-bg: #0f172a;
      --blob-opacity: 0.45;
    }

    [data-base-theme="light"] {
      --bg-color: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.08);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: rgba(255, 255, 255, 0.9);
      --modal-bg: #ffffff;
      --blob-opacity: 0.25;
    }

    /* 2. 10色のカラーテーマ */
    [data-color-theme="aurora"] {
      --accent-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --accent-glow: rgba(168, 85, 247, 0.4);
      --card-hover-border: #a855f7;
      --blob1: #4f46e5; --blob2: #c026d3; --blob3: #06b6d4;
    }
    [data-color-theme="cyberpunk"] {
      --accent-grad: linear-gradient(135deg, #ff0055 0%, #facc15 100%);
      --accent-glow: rgba(255, 0, 85, 0.5);
      --card-hover-border: #facc15;
      --blob1: #ff0055; --blob2: #7928ca; --blob3: #facc15;
    }
    [data-color-theme="emerald"] {
      --accent-grad: linear-gradient(135deg, #059669 0%, #10b981 50%, #34d399 100%);
      --accent-glow: rgba(16, 185, 129, 0.4);
      --card-hover-border: #34d399;
      --blob1: #047857; --blob2: #0d9488; --blob3: #10b981;
    }
    [data-color-theme="sunset"] {
      --accent-grad: linear-gradient(135deg, #f97316 0%, #ef4444 50%, #f43f5e 100%);
      --accent-glow: rgba(249, 115, 22, 0.4);
      --card-hover-border: #f97316;
      --blob1: #ea580c; --blob2: #dc2626; --blob3: #f43f5e;
    }
    [data-color-theme="ocean"] {
      --accent-grad: linear-gradient(135deg, #0284c7 0%, #2563eb 50%, #1d4ed8 100%);
      --accent-glow: rgba(37, 99, 235, 0.4);
      --card-hover-border: #38bdf8;
      --blob1: #0284c7; --blob2: #2563eb; --blob3: #06b6d4;
    }
    [data-color-theme="sakura"] {
      --accent-grad: linear-gradient(135deg, #fb7185 0%, #f43f5e 50%, #e11d48 100%);
      --accent-glow: rgba(251, 113, 133, 0.4);
      --card-hover-border: #fb7185;
      --blob1: #fda4af; --blob2: #f43f5e; --blob3: #e11d48;
    }
    [data-color-theme="amber"] {
      --accent-grad: linear-gradient(135deg, #d97706 0%, #f59e0b 50%, #eab308 100%);
      --accent-glow: rgba(245, 158, 11, 0.4);
      --card-hover-border: #f59e0b;
      --blob1: #d97706; --blob2: #f59e0b; --blob3: #ca8a04;
    }
    [data-color-theme="lavender"] {
      --accent-grad: linear-gradient(135deg, #8b5cf6 0%, #a855f7 50%, #d946ef 100%);
      --accent-glow: rgba(139, 92, 246, 0.4);
      --card-hover-border: #c084fc;
      --blob1: #7c3aed; --blob2: #a855f7; --blob3: #c084fc;
    }
    [data-color-theme="mint"] {
      --accent-grad: linear-gradient(135deg, #14b8a6 0%, #06b6d4 50%, #38bdf8 100%);
      --accent-glow: rgba(20, 184, 166, 0.4);
      --card-hover-border: #2dd4bf;
      --blob1: #0d9488; --blob2: #0891b2; --blob3: #0284c7;
    }
    [data-color-theme="crimson"] {
      --accent-grad: linear-gradient(135deg, #be123c 0%, #e11d48 50%, #9f1239 100%);
      --accent-glow: rgba(225, 29, 72, 0.4);
      --card-hover-border: #f43f5e;
      --blob1: #9f1239; --blob2: #be123c; --blob3: #881337;
    }

    /* 3. 💥 超派手キラキラ（ULTRA RAINBOW）モード */
    [data-colorful="true"] body {
      background: linear-gradient(-45deg, #ff0055, #7928ca, #00dfd8, #ff007f, #eab308, #10b981) !important;
      background-size: 400% 400% !important;
      animation: rainbowBg 4s ease infinite !important;
    }
    @keyframes rainbowBg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    [data-colorful="true"] .store-card, 
    [data-colorful="true"] .search-panel,
    [data-colorful="true"] .top-controls {
      border: 2px solid transparent !important;
      background-image: linear-gradient(var(--card-bg), var(--card-bg)), linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bf7, #7a00ff, #ff00c8) !important;
      background-origin: border-box !important;
      background-clip: padding-box, border-box !important;
      animation: pulseNeon 1.2s infinite alternate, rainbowRotate 3s linear infinite !important;
      box-shadow: 0 0 30px rgba(255, 0, 255, 0.7), inset 0 0 15px rgba(0, 255, 255, 0.5) !important;
    }

    @keyframes pulseNeon {
      0% { box-shadow: 0 0 20px #ff0055, 0 0 40px #facc15; }
      100% { box-shadow: 0 0 40px #00ffd5, 0 0 60px #7928ca; transform: scale(1.02); }
    }

    [data-colorful="true"] h1, 
    [data-colorful="true"] .title-tag {
      animation: textStrobe 0.3s infinite alternate !important;
    }
    @keyframes textStrobe {
      0% { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0055; filter: hue-rotate(0deg); }
      100% { text-shadow: 0 0 25px #00ffff, 0 0 50px #00ff00; filter: hue-rotate(360deg); }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 20px 80px;
      overflow-x: hidden;
      position: relative;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    .bg-blobs { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; filter: blur(90px); pointer-events: none; }
    .blob { position: absolute; border-radius: 50%; opacity: var(--blob-opacity); animation: floatBlob 25s infinite alternate ease-in-out; transition: all 0.5s ease; }
    .blob-1 { width: 450px; height: 450px; background: var(--blob1); top: -100px; left: -100px; }
    .blob-2 { width: 500px; height: 500px; background: var(--blob2); bottom: -150px; right: -100px; animation-delay: -7s; }
    .blob-3 { width: 350px; height: 350px; background: var(--blob3); top: 40%; left: 50%; transform: translate(-50%, -50%); animation-delay: -14s; }

    @keyframes floatBlob {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, 80px) scale(1.15); }
      100% { transform: translate(-40px, 40px) scale(0.9); }
    }

    .container { max-width: 1000px; margin: 0 auto; position: relative; z-index: 1; }

    /* コントロールバー */
    .top-controls {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 25px;
      background: var(--card-bg); padding: 12px 20px; border-radius: 50px; border: 1px solid var(--card-border); backdrop-filter: blur(15px);
    }
    .base-theme-toggle, .colorful-toggle, .diag-reopen-btn {
      background: rgba(255, 255, 255, 0.1); border: 1px solid var(--card-border); color: var(--text-main);
      padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .base-theme-toggle:hover, .colorful-toggle:hover, .diag-reopen-btn:hover { transform: scale(1.05); }
    .colorful-toggle.active { background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #8b00ff); color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

    .color-palette { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .color-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform 0.2s; }
    .color-dot:hover { transform: scale(1.25); }
    .color-dot.active { border-color: var(--text-main); transform: scale(1.2); }

    header { text-align: center; margin-bottom: 25px; }
    .title-tag {
      display: inline-block; font-size: 0.8rem; letter-spacing: 0.25em; text-transform: uppercase;
      background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; margin-bottom: 8px;
    }
    h1 { font-size: 2.5rem; font-weight: 800; line-height: 1.2; color: var(--text-main); margin-bottom: 15px; }

    /* 検索パネル */
    .search-panel {
      background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--card-border);
      border-radius: 24px; padding: 22px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 15px;
    }
    .input-group { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); font-weight: 600; }
    input, select {
      width: 100%; background: var(--input-bg); border: 1px solid var(--card-border);
      border-radius: 12px; padding: 12px 16px; color: var(--text-main); font-size: 0.95rem; outline: none; transition: all 0.3s;
    }
    input:focus, select:focus { border-color: var(--card-hover-border); box-shadow: 0 0 15px var(--accent-glow); }

    .action-bar { display: flex; justify-content: center; margin-bottom: 20px; }
    .btn-fav-filter {
      background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main);
      font-weight: 600; padding: 12px 24px; border-radius: 50px; cursor: pointer; transition: all 0.3s ease;
    }
    .btn-fav-filter.active { background: #ec4899; color: #fff; border-color: #ec4899; box-shadow: 0 0 20px rgba(236, 72, 153, 0.4); }

    .quick-tags { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .tag-chip {
      background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted);
      padding: 6px 14px; border-radius: 15px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
    }
    .tag-chip:hover { background: var(--accent-grad); color: #fff; }

    .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 10px; }
    .result-count span { color: var(--text-main); font-weight: 800; font-size: 1.2rem; background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* 店舗グリッド */
    .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .store-card {
      background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--card-border);
      border-radius: 20px; padding: 22px; display: flex; flex-direction: column; position: relative;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); animation: fadeInUp 0.4s forwards;
    }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .store-card:hover { transform: translateY(-5px); border-color: var(--card-hover-border); box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15); }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .card-category { font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: rgba(150, 150, 150, 0.15); border: 1px solid var(--card-border); color: var(--text-main); }
    .fav-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; opacity: 0.3; filter: grayscale(100%); transition: all 0.2s; }
    .fav-btn.active { opacity: 1; filter: grayscale(0%); transform: scale(1.15); }

    .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; color: var(--text-main); line-height: 1.3; }
    .card-kana { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px; }
    .card-address { font-size: 0.85rem; color: var(--text-main); margin-bottom: 15px; }

    .card-actions { display: flex; gap: 6px; margin-top: auto; border-top: 1px solid var(--card-border); padding-top: 12px; }
    .action-btn {
      flex: 1; background: rgba(150, 150, 150, 0.1); border: 1px solid var(--card-border);
      border-radius: 8px; padding: 8px 0; color: var(--text-main); font-size: 0.75rem; cursor: pointer; text-decoration: none;
      display: flex; align-items: center; justify-content: center; gap: 4px; transition: all 0.2s;
    }
    .action-btn:hover { background: var(--accent-grad); color: #fff; }

    /* 初期表示プレースホルダーカード */
    .empty-prompt {
      grid-column: 1 / -1; text-align: center; padding: 60px 20px;
      background: var(--card-bg); border: 2px dashed var(--card-border); border-radius: 24px;
    }

    /* 🎨 好きな色診断モーダル */
    .diag-modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(15px); display: flex; justify-content: center; align-items: center; z-index: 500;
      opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
    }
    .diag-modal-overlay.active { opacity: 1; pointer-events: auto; }
    .diag-card {
      background: var(--modal-bg); border: 1px solid var(--card-hover-border); border-radius: 30px;
      padding: 35px 25px; width: 90%; max-width: 480px; text-align: center; box-shadow: 0 0 50px var(--accent-glow); color: var(--text-main);
    }
    .diag-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 10px; background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .diag-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
    .diag-opt-btn {
      background: rgba(150, 150, 150, 0.1); border: 1px solid var(--card-border); border-radius: 16px;
      padding: 16px 10px; color: var(--text-main); font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: all 0.2s;
    }
    .diag-opt-btn:hover { background: var(--accent-grad); color: #fff; transform: translateY(-3px); }

    /* 通用モーダル / トースト */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; z-index: 100;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content {
      background: var(--modal-bg); border: 1px solid var(--card-hover-border); border-radius: 28px;
      padding: 30px; width: 90%; max-width: 380px; text-align: center; color: var(--text-main);
    }
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: #10b981; color: #fff; padding: 12px 24px; border-radius: 30px; font-weight: 600;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3); opacity: 0; transition: all 0.3s ease; z-index: 600;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="container">
    <div class="top-controls">
      <button class="base-theme-toggle" id="base-theme-btn" onclick="toggleBaseTheme()">☀️ ライト</button>
      <button class="diag-reopen-btn" onclick="startColorDiag()">🎨 色診断</button>
      
      <div class="color-palette">
        <div class="color-dot active" style="background:#a855f7" title="Aurora" onclick="setColorTheme('aurora', this)"></div>
        <div class="color-dot" style="background:#ff0055" title="Cyberpunk" onclick="setColorTheme('cyberpunk', this)"></div>
        <div class="color-dot" style="background:#10b981" title="Emerald" onclick="setColorTheme('emerald', this)"></div>
        <div class="color-dot" style="background:#f97316" title="Sunset" onclick="setColorTheme('sunset', this)"></div>
        <div class="color-dot" style="background:#2563eb" title="Ocean" onclick="setColorTheme('ocean', this)"></div>
        <div class="color-dot" style="background:#fb7185" title="Sakura" onclick="setColorTheme('sakura', this)"></div>
        <div class="color-dot" style="background:#f59e0b" title="Amber" onclick="setColorTheme('amber', this)"></div>
        <div class="color-dot" style="background:#8b5cf6" title="Lavender" onclick="setColorTheme('lavender', this)"></div>
        <div class="color-dot" style="background:#14b8a6" title="Mint" onclick="setColorTheme('mint', this)"></div>
        <div class="color-dot" style="background:#e11d48" title="Crimson" onclick="setColorTheme('crimson', this)"></div>
      </div>

      <button class="colorful-toggle" id="colorful-btn" onclick="toggleColorfulMode()">💥 超キラキラ</button>
    </div>

    <header>
      <span class="title-tag">Interactive Location Guide</span>
      <h1>取扱店舗ガイド</h1>
    </header>

    <!-- 検索パネル -->
    <div class="search-panel">
      <div class="input-group">
        <label for="category-select">1. Category (カテゴリー選択)</label>
        <select id="category-select">
          <option value="">-- カテゴリーを選択してください --</option>
        </select>
      </div>
      <div class="input-group">
        <label for="keyword">2. Search Keyword (フリーワード)</label>
        <input type="text" id="keyword" placeholder="店舗名・フリガナ・住所...">
      </div>
    </div>

    <!-- ❤️ お気に入り ＆ タグ -->
    <div class="action-bar">
      <button class="btn-fav-filter" id="fav-filter-btn">❤️ お気に入り店舗のみ表示</button>
    </div>

    <div class="quick-tags">
      <span class="tag-chip" onclick="applyTag('イオンモール')">📍 イオンモール</span>
      <span class="tag-chip" onclick="applyTag('園町')">📍 園町</span>
      <span class="tag-chip" onclick="applyTag('スーパー')">🛒 スーパー</span>
      <span class="tag-chip" onclick="resetSearch()">🔄 リセット</span>
    </div>

    <div class="status-bar">
      <div class="result-count" id="result-count">カテゴリーまたはキーワードを選択してください</div>
    </div>

    <div class="store-grid" id="store-grid"></div>
  </div>

  <!-- 🎨 好きな色診断モーダル -->
  <div class="diag-modal-overlay" id="diag-modal">
    <div class="diag-card">
      <div id="diag-step-1">
        <h2 class="diag-title">🎨 直感カラー診断</h2>
        <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:15px;">今の気分に一番近いものを選んでください！</p>
        <div class="diag-options">
          <button class="diag-opt-btn" onclick="finishDiag('cyberpunk')">⚡️ エネルギッシュに刺激が欲しい</button>
          <button class="diag-opt-btn" onclick="finishDiag('emerald')">🌿 静かに穏やかに癒やされたい</button>
          <button class="diag-opt-btn" onclick="finishDiag('aurora')">🌌 クリエイティブに考えたい</button>
          <button class="diag-opt-btn" onclick="finishDiag('sunset')">🔥 情熱的にテンションを上げたい</button>
        </div>
      </div>
      <div id="diag-step-result" style="display:none;">
        <h2 class="diag-title" id="diag-res-title">おすすめテーマ</h2>
        <p id="diag-res-desc" style="margin: 15px 0; font-size:1rem;"></p>
        <button class="btn-fav-filter" style="background:var(--accent-grad); color:#fff;" onclick="closeDiagModal()">この色で店舗を探す！</button>
      </div>
    </div>
  </div>

  <!-- 📱 QRコード表示モーダル -->
  <div class="modal-overlay" id="qr-modal">
    <div class="modal-content">
      <h3 id="qr-title" style="margin-bottom:15px; font-size:1.1rem;">店舗QRコード</h3>
      <div id="qr-code-container" style="margin: 15px 0;"></div>
      <button class="btn-fav-filter" onclick="closeQrModal()">閉じる</button>
    </div>
  </div>

  <div class="toast" id="toast">コピーしました！</div>

  <script>
    let storesData = [];
    let favoriteStores = JSON.parse(localStorage.getItem('fav_stores') || '[]');
    let showFavoritesOnly = false;

    const themeNames = {
      aurora: '🌌 Aurora（宇宙）', cyberpunk: '🌆 Cyberpunk（ネオン）', emerald: '🌿 Emerald（自然）',
      sunset: '🌅 Sunset（夕暮れ）', ocean: '🌊 Ocean（深海）', sakura: '🌸 Sakura（桜）',
      amber: '琥珀 Amber（琥珀）', lavender: '💜 Lavender（ラベンダー）', mint: '🍃 Mint（ミント）', crimson: '🌹 Crimson（深紅）'
    };

    async function loadStores() {
      try {
        const response = await fetch('data.json');
        if (!response.ok) throw new Error();
        storesData = await response.json();
        
        initCategoryFilter(storesData);
        // 重さ対策：初期表示では全件描画を行わない
        renderStores();
        // 初回のみ色診断を開始
        startColorDiag();
      } catch (error) {
        document.getElementById('result-count').textContent = 'データの読み込みに失敗しました。';
      }
    }

    function initCategoryFilter(data) {
      const categorySelect = document.getElementById('category-select');
      const categories = [...new Set(data.map(item => item.category))];

      categories.sort((a, b) => {
        const numA = parseInt(a.match(/^(\d+)/)?.[1] || 0, 10);
        const numB = parseInt(b.match(/^(\d+)/)?.[1] || 0, 10);
        return numA - numB;
      });

      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat; option.textContent = cat;
        categorySelect.appendChild(option);
      });
    }

    // 店舗一覧描画（選択・入力がない場合は全件描画を防止して軽量化）
    function renderStores() {
      const gridContainer = document.getElementById('store-grid');
      const countContainer = document.getElementById('result-count');
      const keyword = document.getElementById('keyword').value.toLowerCase().trim();
      const selectedCategory = document.getElementById('category-select').value;

      // 💡 重さ対策：未選択時は全件描画せず案内を表示
      if (!selectedCategory && !keyword && !showFavoritesOnly) {
        gridContainer.innerHTML = `
          <div class="empty-prompt">
            <p style="font-size:1.2rem; font-weight:700; margin-bottom:8px;">🔍 店舗を検索してください</p>
            <p style="font-size:0.85rem; color:var(--text-muted);">上の「カテゴリーを選択」または「キーワード入力」から店舗を表示できます。</p>
          </div>
        `;
        countContainer.innerHTML = 'カテゴリーまたは検索キーワードを指定してください';
        return;
      }

      const filtered = storesData.filter(store => {
        const matchesCategory = !selectedCategory || store.category === selectedCategory;
        const matchesKeyword = !keyword || 
          (store.name && store.name.toLowerCase().includes(keyword)) ||
          (store.kana && store.kana.toLowerCase().includes(keyword)) ||
          (store.address && store.address.toLowerCase().includes(keyword));
        const matchesFav = !showFavoritesOnly || favoriteStores.includes(store.name);

        return matchesCategory && matchesKeyword && matchesFav;
      });

      gridContainer.innerHTML = '';
      countContainer.innerHTML = `検索結果: <span>${filtered.length}</span> 件`;

      if (filtered.length === 0) {
        gridContainer.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 50px; color:var(--text-muted);">該当する店舗が見つかりませんでした。</div>';
        return;
      }

      filtered.forEach((store, index) => {
        const isFav = favoriteStores.includes(store.name);
        const card = document.createElement('div');
        card.className = 'store-card';
        card.style.animationDelay = `${Math.min(index * 0.03, 0.2)}s`;

        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(store.name + ' ' + store.address)}`;

        card.innerHTML = `
          <div class="card-top">
            <span class="card-category">${escapeHtml(store.category)}</span>
            <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${escapeHtml(store.name)}')">❤️</button>
          </div>
          <h2 class="card-title">${escapeHtml(store.name)}</h2>
          <div class="card-kana">${escapeHtml(store.kana || '')}</div>
          <div class="card-address">📍 ${escapeHtml(store.address)}</div>
          
          <div class="card-actions">
            <a href="${mapUrl}" target="_blank" class="action-btn">🗺️ Map</a>
            <button class="action-btn" onclick="openQrModal('${escapeHtml(store.name)}', '${mapUrl}')">📱 QR</button>
            <button class="action-btn" onclick="copyStoreInfo('${escapeHtml(store.name)}', '${escapeHtml(store.address)}')">📋 コピー</button>
          </div>
        `;
        gridContainer.appendChild(card);
      });
    }

    /* 🎨 好きな色診断ロジック */
    function startColorDiag() {
      document.getElementById('diag-step-1').style.display = 'block';
      document.getElementById('diag-step-result').style.display = 'none';
      document.getElementById('diag-modal').classList.add('active');
    }

    function finishDiag(recommendedTheme) {
      document.getElementById('diag-step-1').style.display = 'none';
      const resContainer = document.getElementById('diag-step-result');
      resContainer.style.display = 'block';

      // テーマ適用
      applyThemeByName(recommendedTheme);

      document.getElementById('diag-res-title').textContent = `提案テーマ: ${themeNames[recommendedTheme]}`;
      document.getElementById('diag-res-desc').textContent = `あなたの気分に合わせたテーマカラーを画面全体に適用しました！`;
    }

    function closeDiagModal() {
      document.getElementById('diag-modal').classList.remove('active');
    }

    function applyThemeByName(themeName) {
      document.documentElement.setAttribute('data-color-theme', themeName);
      const dots = document.querySelectorAll('.color-dot');
      dots.forEach(dot => {
        dot.classList.toggle('active', dot.getAttribute('title').toLowerCase() === themeName);
      });
    }

    function setColorTheme(themeName, element) {
      applyThemeByName(themeName);
      showToast(`テーマ: [${themeName.toUpperCase()}]`);
    }

    // 💥 超キラキラモード切り替え
    function toggleColorfulMode() {
      const html = document.documentElement;
      const btn = document.getElementById('colorful-btn');
      const isColorful = html.getAttribute('data-colorful') === 'true';

      if (isColorful) {
        html.setAttribute('data-colorful', 'false');
        btn.classList.remove('active');
        showToast('キラキラモード OFF');
      } else {
        html.setAttribute('data-colorful', 'true');
        btn.classList.add('active');
        showToast('💥 ✨ 超キラキラレインボーモード ON！');
      }
    }

    function toggleBaseTheme() {
      const html = document.documentElement;
      const btn = document.getElementById('base-theme-btn');
      const current = html.getAttribute('data-base-theme');
      
      if (current === 'dark') {
        html.setAttribute('data-base-theme', 'light');
        btn.textContent = '🌙 ダーク';
      } else {
        html.setAttribute('data-base-theme', 'dark');
        btn.textContent = '☀️ ライト';
      }
    }

    function toggleFavorite(storeName) {
      if (favoriteStores.includes(storeName)) {
        favoriteStores = favoriteStores.filter(name => name !== storeName);
      } else {
        favoriteStores.push(storeName);
      }
      localStorage.setItem('fav_stores', JSON.stringify(favoriteStores));
      renderStores();
    }

    document.getElementById('fav-filter-btn').addEventListener('click', function() {
      showFavoritesOnly = !showFavoritesOnly;
      this.classList.toggle('active', showFavoritesOnly);
      renderStores();
    });

    function applyTag(tag) {
      document.getElementById('keyword').value = tag;
      renderStores();
    }

    function resetSearch() {
      document.getElementById('keyword').value = '';
      document.getElementById('category-select').value = '';
      showFavoritesOnly = false;
      document.getElementById('fav-filter-btn').classList.remove('active');
      renderStores();
    }

    function copyStoreInfo(name, address) {
      navigator.clipboard.writeText(`${name}\n住所: ${address}`).then(() => {
        showToast('店名と住所をコピーしました！');
      });
    }

    function openQrModal(name, url) {
      document.getElementById('qr-title').textContent = name;
      const qrContainer = document.getElementById('qr-code-container');
      const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
      qrContainer.innerHTML = `<img src="${qrApiUrl}" alt="QR Code" style="border-radius:12px; border: 4px solid #fff;">`;
      document.getElementById('qr-modal').classList.add('active');
    }

    function closeQrModal() {
      document.getElementById('qr-modal').classList.remove('active');
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    document.getElementById('keyword').addEventListener('input', renderStores);
    document.getElementById('category-select').addEventListener('change', renderStores);

    loadStores();
  </script>
</body>
</html>
